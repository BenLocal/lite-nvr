name: Rust Check

on:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/pre_install_deps.sh'
      - '.github/workflows/rust-check.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/pre_install_deps.sh'
      - '.github/workflows/rust-check.yml'

jobs:
  rust-check:
    name: Check and Test
    runs-on: ubuntu-latest
    env:
      # FFmpeg is installed into ./ffmpeg by scripts/pre_install_deps.sh, which
      # matches the FFMPEG_DIR default in .cargo/config.toml. Test binaries live
      # in target/debug/deps, outside the $ORIGIN rpath, so they need this path.
      LD_LIBRARY_PATH: ${{ github.workspace }}/ffmpeg/lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nvr-dashboard/app/package-lock.json

      - name: Install download dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar xz-utils

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/pre_install_deps.sh') }}

      # The script also downloads ZLMediaKit into ./zlm; that copy is unused in
      # CI because ZLM_DIR stays unset (see below).
      - name: Install FFmpeg (scripts/pre_install_deps.sh)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/pre_install_deps.sh

      - name: Verify FFmpeg installation
        run: |
          set -euxo pipefail
          ffmpeg/bin/ffmpeg -version | head -n1
          test -f ffmpeg/include/libavfilter/avfilter.h

      # ZLMediaKit is fetched by rszlm-sys's build script — the prebuilt archive
      # pinned via ZLM_RELEASE_URL in .cargo/config.toml — exactly as in local
      # dev. Do NOT set ZLM_DIR (the ./zlm copy from pre_install_deps.sh is
      # ignored without it). Historically the asset picked from
      # `releases/latest` was a transcode build linked against FFmpeg 4.x
      # (libavutil.so.56), which clashed with the FFmpeg installed above and
      # broke `cargo test` when the nvr binary loaded libmk_api.so (exit 127).

      - name: Build embedded dashboard assets
        working-directory: nvr-dashboard/app
        run: |
          npm ci
          npm run build

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (workspace)
        run: cargo check --workspace

      - name: Cargo test (workspace, no doctest, skip bin harness)
        run: cargo test --workspace --lib --tests --no-fail-fast

      # SMB backend is behind the optional `smb` feature (links libsmbclient).
      # Verify it still compiles, with the system lib installed only for this step.
      - name: Cargo check (smb feature)
        run: |
          sudo apt-get install -y libsmbclient-dev
          cargo check -p nvr --features smb
