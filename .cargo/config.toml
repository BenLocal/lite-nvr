[env]
FFMPEG_DIR = { value = "ffmpeg", relative = true }
# Full archive URL because rszlm-sys cannot name the `_noffmpeg` asset (the other packages
# link libavutil.so.56 and fail to load next to our FFmpeg). It is the linux/amd64 package,
# so other hosts must set ZLM_DIR (`make install-deps` provides ./zlm).
ZLM_RELEASE_URL = "https://github.com/BenLocal/ZLMediaKit-Build/releases/download/autobuild-2026-10-21/zlmediakit_master_linux_amd64_noffmpeg_latest.tar.gz"

# Linux x86_64
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C",
    "link-arg=-Wl,-rpath-link,ffmpeg/lib",
    "-C",
    "link-arg=-Wl,-rpath,$ORIGIN/../ffmpeg/lib",
]

# Linux aarch64
[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C",
    "link-arg=-Wl,-rpath-link,ffmpeg/lib",
    "-C",
    "link-arg=-Wl,-rpath,$ORIGIN/../ffmpeg/lib",
]

# macOS x86_64
[target.x86_64-apple-darwin]
rustflags = [
    "-C",
    "link-arg=-Wl,-rpath,@executable_path/../ffmpeg/lib",
    "-C",
    "link-arg=-Wl,-rpath,@executable_path/../../ffmpeg/lib",
    "-C",
    "link-arg=-Wl,-rpath,@executable_path/../../zlm/lib",
]

# macOS aarch64 (Apple Silicon)
[target.aarch64-apple-darwin]
rustflags = [
    "-C",
    "link-arg=-Wl,-rpath,@executable_path/../ffmpeg/lib",
    "-C",
    "link-arg=-Wl,-rpath,@executable_path/../../ffmpeg/lib",
    "-C",
    "link-arg=-Wl,-rpath,@executable_path/../../zlm/lib",
]

# Windows x86_64 MSVC
[target.x86_64-pc-windows-msvc]
rustflags = []

# Windows aarch64 MSVC
[target.aarch64-pc-windows-msvc]
rustflags = []
