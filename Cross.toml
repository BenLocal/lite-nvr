[target.x86_64-unknown-linux-gnu]
image = { name = "lite-nvr-cross:host-native", toolchain = ["linux/amd64=x86_64-unknown-linux-gnu", "linux/arm64=aarch64-unknown-linux-gnu"] }

[target.aarch64-unknown-linux-gnu]
image = { name = "lite-nvr-cross:host-native", toolchain = ["linux/amd64=x86_64-unknown-linux-gnu", "linux/arm64=aarch64-unknown-linux-gnu"] }

[build.env]
passthrough = [
    "CMAKE_BUILD_PARALLEL_LEVEL", "APT_MIRROR", "FFMPEG_DIR", "ZLM_DIR", "SHERPA_ONNX_LIB_DIR", "PKG_CONFIG_ALLOW_CROSS",
    "BINDGEN_EXTRA_CLANG_ARGS", "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS",
    "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS",
    "CC_aarch64_unknown_linux_gnu", "CXX_aarch64_unknown_linux_gnu",
    "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER",
]
