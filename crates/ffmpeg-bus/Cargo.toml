[package]
name = "ffmpeg-bus"
version = "0.1.0"
edition = "2024"

[features]
rockchip = ["dep:rustix"]

[dependencies]
ffmpeg-next = { workspace = true, features = ["device"] }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true, features = ["backtrace"] }
bytes = { workspace = true }
tokio-util = { workspace = true }
log = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Rockchip DMABUF V4L2 capture (ioctl, mmap, poll).
rustix = { workspace = true, features = ["fs", "mm", "time"], optional = true }
