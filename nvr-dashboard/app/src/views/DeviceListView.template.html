  <div class="content-section device-page">
    <div class="page-header">
      <div class="header-content">
        <h1 class="page-title">设备管理</h1>
        <p class="page-subtitle">实时监控和管理接入的 NVR 设备</p>
      </div>
      <div class="page-actions">
        <Button icon="pi pi-refresh" severity="secondary" outlined aria-label="刷新" @click="loadDevices()" />
        <Button icon="pi pi-plus" label="添加设备" @click="openCreatePage" />
      </div>
    </div>

    <div v-if="!loading && !devices.length" class="empty-state device-empty-state">
      <i class="pi pi-video empty-state-icon" />
      <p class="empty-state-text">暂无设备数据</p>
      <p class="device-empty-state-hint">点击右上角“添加设备”开始接入</p>
    </div>

    <Card v-else class="data-card">
      <template #content>
        <DataTable
          data-key="id"
          :value="devices"
          :loading="loading"
          striped-rows
          scrollable
          scroll-height="flex"
          class="content-table"
          responsive-layout="scroll"
        >
          <Column
            field="name"
            header="设备名称"
            style="width: 12rem; min-width: 12rem; max-width: 12rem"
          >
            <template #body="{ data }">
              <span class="single-line-text" :title="data.name">{{ data.name }}</span>
            </template>
          </Column>
          <Column field="id" header="设备 ID" style="width: 17rem; min-width: 17rem">
            <template #body="{ data }">
              <div class="copy-cell copy-cell-id" :title="data.id">
                <span class="mono-text ellipsis-text">{{ data.id }}</span>
                <Button
                  icon="pi pi-copy"
                  text
                  rounded
                  class="copy-button"
                  aria-label="复制设备 ID"
                  @click="copyText(data.id, '设备 ID')"
                />
              </div>
            </template>
          </Column>
          <Column
            field="input_type"
            header="输入类型"
            style="width: 8rem; min-width: 8rem; max-width: 8rem"
          >
            <template #body="{ data }">
              <span class="single-line-text" :title="data.input_type">{{ data.input_type }}</span>
            </template>
          </Column>
          <Column field="input_value" header="输入地址/标识" style="width: 24rem; min-width: 24rem">
            <template #body="{ data }">
              <div class="copy-cell copy-cell-input" :title="inputValueDisplay(data)">
                <span class="mono-text ellipsis-text">{{ inputValueDisplay(data) }}</span>
                <Button
                  icon="pi pi-copy"
                  text
                  rounded
                  class="copy-button"
                  aria-label="复制输入地址"
                  @click="copyText(inputValueDisplay(data), '输入地址')"
                />
              </div>
            </template>
          </Column>
          <Column field="updated_at" header="更新时间" style="width: 12rem; min-width: 12rem">
            <template #body="{ data }">
              {{ formatTime(data.updated_at) }}
            </template>
          </Column>
          <Column header="状态" style="width: 7rem; min-width: 7rem">
            <template #body="{ data }">
              <Tag
                :value="data.state === 'running' ? '运行中' : data.state === 'starting' ? '连接中' : data.state === 'idle' ? '空闲' : '未知'"
                :severity="data.state === 'running' ? 'success' : data.state === 'starting' ? 'warn' : 'secondary'"
              />
            </template>
          </Column>
          <Column
            header="操作"
            :exportable="false"
            class="action-column"
            style="width: 9rem; min-width: 9rem; max-width: 9rem"
          >
            <template #body="{ data }">
              <div class="row-actions">
                <Button icon="pi pi-play" text rounded severity="success" aria-label="预览" title="播放" @click="openPreview(data)" />
                <Button icon="pi pi-ellipsis-v" text rounded aria-label="更多操作" title="更多操作" aria-haspopup="menu" aria-controls="device-actions-menu" @click="openActions($event, data)" />
              </div>
            </template>
          </Column>
        </DataTable>
      </template>
    </Card>

    <Menu id="device-actions-menu" ref="actionsMenu" :model="actionItems" popup />

    <Dialog
      v-model:visible="metricsVisible"
      modal
      :header="`流拓扑 · ${metricsDevice?.name ?? ''}`"
      :style="{ width: 'min(76rem, calc(100vw - 2rem))' }"
      :content-style="{ overflowY: 'auto', overflowX: 'hidden' }"
    >
      <Message v-if="metricsError" severity="warn" class="metrics-warning">{{ metricsError }}，正在重试；保留上次采样。</Message>
      <Button label="刷新音频来源" icon="pi pi-refresh" size="small" severity="secondary" :loading="topologyAudioLoading" @click="refreshAudioOrigins" />
      <DeviceFlowTopology
        v-if="metricsVisible && metricsDevice"
        :metrics="deviceMetrics[metricsDevice.id]"
        :device="topologyDevice ?? undefined"
        :mixer="topologyMixer"
        :audio-sources="topologySources"
        :program="topologyProgram"
        :audio-loading="topologyAudioLoading"
        :audio-error="topologyAudioError"
        :stale="metricsError !== null"
      />
    </Dialog>

    <Dialog
      v-model:visible="previewVisible"
      modal
      header="实时预览"
      :style="{ width: 'min(60rem, calc(100vw - 2rem))' }"
      :content-style="{ overflowY: 'auto', overflowX: 'hidden' }"
      @hide="closePreview"
    >
      <div class="preview-shell">
        <div class="preview-meta">
          <div class="preview-title">{{ previewDevice?.name }}</div>
          <div class="preview-url">
            {{ previewDevice?.flv_url || (previewDevice ? buildFlvUrl(previewDevice.id) : "") }}
          </div>
        </div>
        <FlvPreviewPlayer
          :url="previewDevice?.flv_url || (previewDevice ? buildFlvUrl(previewDevice.id) : '')"
          :detect-device-id="previewDevice?.id"
          :persistent-detect-enabled="previewDevice?.config?.detect?.enabled ?? false"
        />
        <TranscriptPanel
          v-if="previewDevice"
          :key="previewDevice.id"
          :pipe-id="previewDevice.id"
        />
      </div>
    </Dialog>

    <Dialog
      v-model:visible="ptzDialogVisible"
      modal
      header="云台控制"
      :style="{ width: 'min(22rem, calc(100vw - 2rem))' }"
      @hide="ptzRelease"
    >
      <div class="ptz-pad">
        <span />
        <Button
          icon="pi pi-arrow-up"
          aria-label="上"
          @pointerdown="ptzPress('up')"
          @pointerup="ptzRelease"
          @pointerleave="ptzRelease"
          @pointercancel="ptzRelease"
        />
        <span />
        <Button
          icon="pi pi-arrow-left"
          aria-label="左"
          @pointerdown="ptzPress('left')"
          @pointerup="ptzRelease"
          @pointerleave="ptzRelease"
          @pointercancel="ptzRelease"
        />
        <Button icon="pi pi-stop" severity="secondary" aria-label="停止" @click="sendPtz('stop')" />
        <Button
          icon="pi pi-arrow-right"
          aria-label="右"
          @pointerdown="ptzPress('right')"
          @pointerup="ptzRelease"
          @pointerleave="ptzRelease"
          @pointercancel="ptzRelease"
        />
        <span />
        <Button
          icon="pi pi-arrow-down"
          aria-label="下"
          @pointerdown="ptzPress('down')"
          @pointerup="ptzRelease"
          @pointerleave="ptzRelease"
          @pointercancel="ptzRelease"
        />
        <span />
      </div>

      <div class="ptz-row">
        <Button
          label="放大"
          size="small"
          icon="pi pi-search-plus"
          @pointerdown="ptzPress('zoom_in')"
          @pointerup="ptzRelease"
          @pointerleave="ptzRelease"
          @pointercancel="ptzRelease"
        />
        <Button
          label="缩小"
          size="small"
          icon="pi pi-search-minus"
          @pointerdown="ptzPress('zoom_out')"
          @pointerup="ptzRelease"
          @pointerleave="ptzRelease"
          @pointercancel="ptzRelease"
        />
      </div>

      <div class="ptz-row">
        <label class="ptz-label">速度</label>
        <Slider v-model="ptzSpeed" :min="1" :max="255" class="ptz-slider" />
        <span class="ptz-value">{{ ptzSpeed }}</span>
      </div>

      <div class="ptz-row">
        <label class="ptz-label">预置位</label>
        <InputNumber
          v-model="ptzPreset"
          :min="1"
          :max="255"
          show-buttons
          :input-style="{ width: '3.5rem' }"
        />
        <Button label="调用" size="small" @click="sendPtz('preset_call', ptzPreset)" />
        <Button label="设置" size="small" severity="secondary" @click="sendPtz('preset_set', ptzPreset)" />
        <Button label="删除" size="small" text severity="danger" @click="sendPtz('preset_delete', ptzPreset)" />
      </div>
    </Dialog>


  </div>
